<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>วิดีโอการสอน : บทที่ 7</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
    /* โทนสีเดียวกับหน้าหลัก (สว่างขึ้นกว่าน้ำตาลเข้ม แต่ชัดกว่าส้มอ่อนเดิม) */
    --main-grad: linear-gradient(135deg, #E67E22, #D35400); 
    --bg: #FFFAF5; 
    --title-color: #A04000;
    --accent: #F39C12;
}

body {
    font-family: 'Prompt', sans-serif;
    margin: 0;
    background: var(--bg);
    color: #444;
}

/* ===== Header ===== */
.header {
    background: var(--main-grad);
    color: white;
    padding: 30px 20px;
    text-align: center;
    border-radius: 0 0 30px 30px;
    box-shadow: 0 6px 15px rgba(211, 84, 0, 0.2);
}

.header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 600;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
}

/* ===== Layout ===== */
.container {
    max-width: 900px;
    margin: 35px auto;
    padding: 0 20px;
}

/* ===== Video Box ===== */
.video-box {
    background: white;
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    border: 1px solid #FFF0E5;
}

/* ชื่อคลิปด้านบน */
.video-title {
    color: var(--title-color);
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 20px;
    border-left: 6px solid var(--accent);
    padding-left: 15px;
    display: flex;
    align-items: center;
}

video {
    width: 100%;
    border-radius: 18px;
    background: #2c3e50; /* สีพื้นหลังวิดีโอให้ดูพรีเมียม */
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

/* --- ปุ่มกลับหน้าบทเรียน --- */
.btn-back {
    display: block;
    margin-top: 30px;
    text-align: center;
    padding: 18px;
    border-radius: 18px;
    background: var(--main-grad);
    color: white;
    text-decoration: none;
    font-size: 20px;
    font-weight: 600;
    transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 5px 15px rgba(211, 84, 0, 0.25);
}

.btn-back:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(211, 84, 0, 0.35);
    background: linear-gradient(135deg, #F39C12, #E67E22);
}

/* Mobile Adjustment */
@media(max-width: 600px) {
    .header h1 { font-size: 22px; }
    .video-box { padding: 20px; }
    .video-title { font-size: 18px; }
}
</style>
</head>

<body>

<div class="header">
    <h1>🎬 หน่วยที่ 7 ทฤษฎีเมตริกซ์และพีชคณิตเชิงเส้น</h1>
</div>

<div class="container">
    <div class="video-box">
        
        <div class="video-title">
            ความรู้เบื้องต้นเกี่ยวกับเมตริกซ์
        </div>

        <video controls>
            <source src="7.1.mp4" type="video/mp4">
            เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
        </video>

        <a href="unit7.html" class="btn-back">
            ⬅ กลับหน้าบทเรียน
        </a>

    </div>
</div>

</body>
</html>
