<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>บทที่ 1 : จำนวนและตัวเลข</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
    --main-grad: linear-gradient(135deg,#ff9a9e,#f77062);
    --bg: #fff0f3;
    --title: #e84a6b;
}

body{
    margin:0;
    font-family:'Prompt',sans-serif;
    background:var(--bg);
}

/* ===== Header ===== */
.header{
    background:var(--main-grad);
    padding:45px 20px;
    text-align:center;
    color:white;
    border-radius:0 0 30px 30px;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.header h1{
    margin:0;
    font-size:34px;
}

/* ===== Layout ===== */
.container{
    max-width:900px;
    width:90%;
    margin:35px auto;
}

/* ===== Section ===== */
.section{
    background:white;
    padding:28px;
    border-radius:22px;
    margin-bottom:22px;
    box-shadow:0 6px 16px rgba(0,0,0,.12);
}

.section h2{
    margin-top:0;
    margin-bottom:18px;
    color:var(--title);
}

/* ===== Buttons ===== */
.btn{
    display:block;
    padding:16px;
    border-radius:16px;
    text-align:center;
    text-decoration:none;
    color:white;
    font-size:22px;
    background:var(--main-grad);
    transition:.25s;
}

.btn:hover{
    transform:scale(1.03);
    box-shadow:0 8px 20px rgba(0,0,0,.2);
}

/* ===== Video Grid (2x2) ===== */
.video-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

/* ===== Navigation 3 Buttons ===== */
.nav-wrap{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:18px;
    margin:45px 0;
}

.nav-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:22px 24px;
    border-radius:24px;
    text-decoration:none;
    box-shadow:0 8px 20px rgba(0,0,0,.18);
    transition:.3s;
}

.nav-card span{font-size:26px;}
.nav-card small{font-size:14px; opacity:.8;}
.nav-card strong{font-size:20px;}

.nav-card.back,
.nav-card.home{
    background:white;
    color:#444;
    border:2px solid #ffd4da;
}

.nav-card.next{
    background:var(--main-grad);
    color:white;
}

.nav-card:hover{
    transform:translateY(-4px);
}

/* ===== Mobile ===== */
@media(max-width:700px){
    .video-grid,
    .nav-wrap{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>หน่วยที่ 1 จำนวนและตัวเลข</h1>
</div>

<div class="container">

    <div class="section">
        <h2>✨ แบบทดสอบก่อนเรียน</h2>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLScBQWDWxHyyPvmpBuf54KvC_vu4WwIscFLyRB5ehRkiZzViwg/viewform?usp=header" target="_blank" class="btn">
            เริ่มทำแบบทดสอบก่อนเรียน
        </a>
    </div>

    <div class="section">
        <h2>🎬 วิดีโอการสอน</h2>

        <div class="video-grid">
            <a href="Learn11.html" class="btn"> ความหมายของจำนวน และตัวเลข</a>
            <a href="Learn12.html" class="btn">จำนวนจริง และระบบจำนวนเต็ม</a>
            
        </div>
    </div>

    <div class="section">
        <h2>📝 แบบฝึกหัด</h2>
        <a href="pretest1.html" class="btn">ทำแบบฝึกหัด</a>
    </div>

    <div class="section">
        <h2>🏁 แบบทดสอบหลังเรียน</h2>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfmLQsc0U9Cd_T96YV2P9aZ9p3wgXyGe6I1qQ7gAp0zorNGfw/viewform?usp=header" target="_blank" class="btn">
            ทำแบบทดสอบหลังเรียน
        </a>
    </div>

    <!-- ===== Navigation ===== -->
    <div class="nav-wrap">

        <a href="Homepage.html" class="nav-card back">
            <div>
                <small>ย้อนกลับ</small><br>
                <strong>บทก่อนหน้า</strong>
            </div>
            <span>⬅</span>
        </a>

        <a href="Homepage.html" class="nav-card home">
            <div>
                <small>กลับไป</small><br>
                <strong>หน้าหลัก</strong>
            </div>
            <span>🏠</span>
        </a>

        <a href="unit2.html" class="nav-card next">
            <div>
                <small>ถัดไป</small><br>
                <strong>บทเรียนถัดไป</strong>
            </div>
            <span>➡</span>
        </a>

    </div>

</div>

</body>
</html>
