<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>วิดีโอการสอน : บทที่ 7</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
    /* ใช้โทนสีส้มอิฐ-น้ำตาลนวลชุดเดียวกับหน้าหลัก */
    --main-grad: linear-gradient(135deg, #E67E22, #D35400); 
    --bg: #FFFAF5; 
    --title-color: #A04000;
    --accent: #F39C12;
}

body {
    font-family: 'Prompt', sans-serif;
    margin: 0;
    background: var(--bg);
    color: #444;
}

/* ===== Header ===== */
.header {
    background: var(--main-grad);
    color: white;
    padding: 30px 20px;
    text-align: center;
    border-radius: 0 0 30px 30px;
    box-shadow: 0 6px 15px rgba(211, 84, 0, 0.2);
}

.header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 600;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
}

/* ===== Layout ===== */
.container {
    max-width: 1000px;
    margin: 35px auto;
    padding: 0 20px;
}

/* ===== Video Box ===== */
.video-box {
    background: white;
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    border: 1px solid #FFF0E5;
}

.video-row {
    display: flex;
    gap: 25px;
    flex-wrap: wrap;
}

.video-item {
    flex: 1;
    min-width: 300px;
}

/* ชื่อคลิปด้านบน */
.video-title {
    color: var(--title-color);
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 12px;
    border-left: 5px solid var(--accent);
    padding-left: 12px;
}

video {
    width: 100%;
    border-radius: 18px;
    background: #2c3e50;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}

/* --- ปุ่มกลับหน้าบทเรียน --- */
.btn-back {
    display: block;
    margin-top: 40px;
    text-align: center;
    padding: 18px;
    border-radius: 18px;
    background: var(--main-grad);
    color: white;
    text-decoration: none;
    font-size: 20px;
    font-weight: 600;
    transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 5px 15px rgba(211, 84, 0, 0.25);
}

.btn-back:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(211, 84, 0, 0.35);
    background: linear-gradient(135deg, #F39C12, #E67E22);
}

/* ปรับปรุงบนมือถือ */
@media(max-width: 700px){
    .header h1 { font-size: 22px; }
    .video-row { gap: 20px; }
    .video-box { padding: 20px; }
}
</style>
</head>

<body>

<div class="header">
    <h1>🎬 หน่วยที่ 7 ทฤษฎีเมตริกซ์และพีชคณิตเชิงเส้น</h1>
</div>

<div class="container">
    <div class="video-box">

        <div class="video-row">
            <div class="video-item">
                <div class="video-title">ระบบสมการเชิงเส้นตัวแปรเดียว</div>
                <video controls>
                    <source src="7.4.1.mp4" type="video/mp4">
                    เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
                </video>
            </div>

            <div class="video-item">
                <div class="video-title">ระบบสมการเชิงเส้นสองตัวแปร</div>
                <video controls>
                    <source src="7.4.2.mp4" type="video/mp4">
                    เบราว์เซอร์ของคุณไม่รองรับการเล่นวิดีโอ
                </video>
            </div>
        </div>

        <a href="unit7.html" class="btn-back">
            ⬅ กลับหน้าบทเรียน
        </a>

    </div>
</div>

</body>
</html>
